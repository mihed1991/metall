<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">

<defs>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f2f2f2"/>
    <stop offset="18%" stop-color="#747474"/>
    <stop offset="42%" stop-color="#d7d7d7"/>
    <stop offset="68%" stop-color="#4b4b4b"/>
    <stop offset="100%" stop-color="#b8b8b8"/>
  </linearGradient>
  <linearGradient id="darkMetal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#252525"/>
    <stop offset="45%" stop-color="#0f0f0f"/>
    <stop offset="100%" stop-color="#2d2d2d"/>
  </linearGradient>
  <linearGradient id="redMetal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#6f1717"/>
    <stop offset="45%" stop-color="#3d0f0f"/>
    <stop offset="100%" stop-color="#8c2424"/>
  </linearGradient>
  <radialGradient id="panelGlow" cx="50%" cy="44%" r="70%">
    <stop offset="0%" stop-color="#1b1b1b"/>
    <stop offset="70%" stop-color="#0b0b0b"/>
    <stop offset="100%" stop-color="#050505"/>
  </radialGradient>
  <filter id="orangeGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
  </filter>
</defs>


<rect x="42" y="42" width="428" height="428" rx="76" fill="url(#darkMetal)" stroke="url(#metal)" stroke-width="18" filter="url(#softShadow)"/>
<rect x="74" y="74" width="364" height="364" rx="58" fill="url(#panelGlow)" stroke="#6f1717" stroke-width="10"/>
<path d="M72 150 L72 92 Q72 72 92 72 L154 72 L121 122 Z" fill="url(#redMetal)"/>
<path d="M440 150 L440 92 Q440 72 420 72 L358 72 L391 122 Z" fill="url(#redMetal)"/>
<path d="M72 362 L72 420 Q72 440 92 440 L154 440 L121 390 Z" fill="url(#redMetal)"/>
<path d="M440 362 L440 420 Q440 440 420 440 L358 440 L391 390 Z" fill="url(#redMetal)"/>
<rect x="86" y="84" width="340" height="340" rx="50" fill="none" stroke="#ff7a00" stroke-opacity="0.38" stroke-width="5" filter="url(#orangeGlow)"/>


<g filter="url(#orangeGlow)">
  <rect x="149" y="149" width="214" height="214" rx="56" fill="none" stroke="url(#metal)" stroke-width="24"/>
  <circle cx="256" cy="256" r="58" fill="none" stroke="url(#metal)" stroke-width="24"/>
  <circle cx="326" cy="187" r="15" fill="url(#metal)"/>
  <rect x="149" y="149" width="214" height="214" rx="56" fill="none" stroke="#ff8a00" stroke-width="5" opacity="0.95"/>
  <circle cx="256" cy="256" r="58" fill="none" stroke="#ff8a00" stroke-width="5"/>
</g>

</svg>